<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Read the embedded page</title>
    <!-- Shown inside the card on a page whose article is in a frame (ui/frame-ask-card.ts). Its
         own page because only a click in one of Aloud's pages may ask the browser for a site. -->
    <style>
      :root { color-scheme: normal; background: transparent; }
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
      button {
        display: block; width: 100%; height: 34px; border: 0; border-radius: 999px; cursor: pointer;
        font: 650 13.5px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffd60a; color: #1a1a1a;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      button:focus-visible { outline: 2px solid #ffffff; outline-offset: -4px; }
    </style>
  </head>
  <body>
    <button id="go" type="button" disabled>Read it</button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
