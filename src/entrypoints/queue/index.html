<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aloud — Reading queue</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header class="q-head">
        <div>
          <h1>Reading queue</h1>
          <p class="muted small" id="count">Loading…</p>
        </div>
        <div class="q-head-actions">
          <button id="clear" class="ghost danger btn-sm" type="button" hidden>Clear queue</button>
          <button id="playAll" class="primary" type="button" hidden>▶ Play queue</button>
        </div>
      </header>

      <!-- Shown when there is nothing queued: how things get in here. -->
      <section id="empty" class="q-empty" hidden>
        <h2>Nothing queued yet</h2>
        <p>Right-click any article and choose <b>Add page to reading queue</b>, or right-click a link
          and choose <b>Add link to reading queue</b>. Articles play here one after another — and
          pages you add are saved as they are, so they play even offline.</p>
      </section>

      <ol id="list" class="q-list"></ol>

      <!-- The article being read. The reader session runs on this like on any page. -->
      <section id="now" class="q-now" hidden>
        <p class="q-now-label" id="nowLabel">Now reading</p>
        <div id="prompt" class="q-prompt" hidden></div>
        <article id="article"></article>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
